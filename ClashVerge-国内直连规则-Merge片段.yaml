# ============================================================
# Clash Verge Merge 扩展 - 优先直连规则（能不走代理就不走代理）
# ============================================================
# 【核心思路】
#   1. 国内常用网站/域名：一律强制 DIRECT 直连；
#   2. 国际服务中「不用代理就能访问」的也全部直连，绝不绕代理，
#      例如 Claude Code 用到的 Anthropic API（api.anthropic.com）等；
#   3. 真正被墙的服务（Google / OpenAI / X / YouTube / Telegram 等）
#      不在本列表内，仍按订阅原有规则走代理。
#
# 【使用方式】
#   1. Clash Verge → 订阅 → 点击订阅 → 编辑文件 → Merge
#      （或 设置 → 全局扩展 → Merge）
#   2. 把下面 "prepend-rules:" 开头的整段内容粘贴进去，保存并重新订阅。
#
# 【说明】
#   1. 使用 prepend-rules：规则插入到订阅规则列表【最前面】，绝对优先——
#      即使订阅里原本有同名网站的走代理规则，也会先命中这里的 DIRECT。
#   2. 末尾三条是兜底：整个 .cn 域名、geosite 收录的国内站点、国内 IP 全部直连
#      （GEOSITE / GEOIP 依赖 Clash Verge 自带的 geosite/geoip 数据库）。
#   3. 某个网站直连不顺畅、想改走代理时，删掉对应那一行即可。
# ============================================================

